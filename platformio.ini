; Rover ESP32 Firmware — RadioMaster Pocket
;
;   pio run -e esp32dev  -t upload   → main_rover_pocket.cpp (manual + autonomous)
;   pio run -e esp32copy -t upload   → main_rover_pocket_copy.cpp (manual only)
;   pio device monitor -b 115200     → serial monitor

[env]
platform      = espressif32
board         = esp32dev
framework     = arduino
lib_deps      = zz-cat/CRSFforArduino
monitor_speed = 115200

[env:esp32dev]
build_src_filter = +<main_rover_pocket.cpp>

[env:esp32copy]
build_src_filter = +<main_rover_pocket_copy.cpp>
